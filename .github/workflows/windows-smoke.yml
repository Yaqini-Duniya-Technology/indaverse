name: Windows launcher and media smoke
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: python -m pip install -r apps/api/requirements.txt
      - name: Verify launcher and API identity
        run: python -m pytest tests/operations/test_launcher_smoke.py -q
        env:
          INDAVERSE_LAUNCHER_SMOKE: '1'
      - name: Install FFmpeg if needed and require both tools
        shell: pwsh
        run: |
          if (!(Get-Command ffmpeg -ErrorAction SilentlyContinue) -or !(Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "FFmpeg installation failed." }
            $env:Path = "$env:ChocolateyInstall\bin;$env:Path"
            "$env:ChocolateyInstall\bin" >> $env:GITHUB_PATH
          }
          ffmpeg -version
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg is unavailable." }
          ffprobe -version
          if ($LASTEXITCODE -ne 0) { throw "FFprobe is unavailable." }
      - name: Render and decode an MP4 and a publishing kit
        run: python scripts/test_api.py -k "real_trim_returns_requested_frames_and_audio or private_delivery_kit_matches_saved_render"
