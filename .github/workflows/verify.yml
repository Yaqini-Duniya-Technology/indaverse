name: Verify IndaVerse
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r apps/api/requirements.txt
      - run: python scripts/test_api.py
      - run: python -m pytest tests/operations -q
      - run: python scripts/check_repository.py
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm --prefix apps/web ci
      - run: npm --prefix apps/web test
      - run: npx eslint src/app/status/page.tsx src/components/SnapshotCompare.tsx src/lib/snapshot-diff.mjs
        working-directory: apps/web
      - run: npm --prefix apps/web run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8002
